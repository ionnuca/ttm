spring.application.name=ttm
server.port=${PORT:8080}
# În spatele proxy-ului HTTPS (Caddy): adresa și protocolul se iau din antetele X-Forwarded-*
server.forward-headers-strategy=native
# Sesiunea de pe server (paginile deschise) durează o zi de inactivitate; autentificarea se păstrează
# și după aceea prin cookie-ul „ține-mă minte” (app.remember-me.days)
server.servlet.session.timeout=24h
app.remember-me.days=${APP_REMEMBER_ME_DAYS:30}
app.remember-me.key=${APP_REMEMBER_ME_KEY:}

# --- Baza de date (valorile implicite corespund docker-compose.yml) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ttm}
spring.datasource.username=${DB_USER:ttm}
spring.datasource.password=${DB_PASSWORD:ttm}

# Schema e creată și actualizată doar de Flyway (src/main/resources/db/migration)
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Aplicație ---
# Administratorul creat la prima pornire, dacă nu există încă niciun administrator.
# Dacă parola lipsește, se generează una aleatorie și se afișează o singură dată în log.
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}
# Opțional: numele administratorului; dacă ambele sunt completate, primește și profil de jucător
app.admin.first-name=${APP_ADMIN_FIRST_NAME:}
app.admin.last-name=${APP_ADMIN_LAST_NAME:}
# Permite crearea de conturi din pagina publică de înregistrare
app.registration.enabled=${APP_REGISTRATION_ENABLED:true}
# Eticheta mediului, afișată în bara de sus (de exemplu TEST pe aplicația de test); goală în producție
app.environment-label=${APP_ENVIRONMENT_LABEL:}

# Profilul "dev" include și datele demonstrative ("demo").
# Profilul "seed" adaugă doar 10 jucători de test, într-o bază goală (pentru prima pornire în producție).
spring.profiles.group.dev=demo

# --- Încărcări (poze de profil) ---
# Implicit Spring Boot acceptă doar 1 MB; pozele de pe telefon au de obicei 2–10 MB
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# --- Vaadin ---
vaadin.launch-browser=false
